<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar Livezy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rojo:#AD182C;--rosa:#F9D4E4;--azul:#ACCCFF;--bg:#faf8f7;--card:#fff;--txt:#1d1b1b;--sub:#6b6566;--borde:#ebe5e3;
  --sube:#1f8a4c;--sube-bg:#e3f4ea;--baja:#c0392b;--baja-bg:#fbe7e4;--fila:#fdf6f8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141213;--card:#1d1a1b;--txt:#f2eeee;--sub:#a59d9e;--borde:#332e2f;
  --sube:#4cc985;--sube-bg:#173324;--baja:#ff7a6b;--baja-bg:#3a1c19;--fila:#251f21;--rosa:#4a2733}}
:root[data-theme=dark]{--bg:#141213;--card:#1d1a1b;--txt:#f2eeee;--sub:#a59d9e;--borde:#332e2f;--sube:#4cc985;--sube-bg:#173324;
  --baja:#ff7a6b;--baja-bg:#3a1c19;--fila:#251f21;--rosa:#4a2733}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
header{background:var(--rojo);color:#fff;padding:18px 16px 0}
.w{max-width:1280px;margin:0 auto}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
h1 span{font-weight:400;opacity:.8}
.meta{opacity:.85;font-size:13px;margin:4px 0 14px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.75;font:inherit;font-weight:500;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--rojo);opacity:1}
main{padding:20px 16px 60px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.dos{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.card{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 4px;font-size:15px}
.card p.s{margin:0 0 12px;color:var(--sub);font-size:13px}
.kpi b{display:block;font-size:28px;font-weight:700;color:var(--rojo);line-height:1.1}
.kpi span{color:var(--sub);font-size:13px}
.barra{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;padding:4px 0;cursor:pointer;border-radius:6px}
.barra:hover{background:var(--fila)}
.barra .b{height:10px;background:var(--rosa);border-radius:5px;overflow:hidden}
.barra .b i{display:block;height:100%;background:var(--rojo);border-radius:5px}
.barra small{color:var(--sub);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--fila);border:1px solid var(--borde);border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip.bo{border-color:var(--rojo);color:var(--rojo)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.bar input[type=search],.bar select{font:inherit;padding:7px 10px;border:1px solid var(--borde);border-radius:9px;background:var(--card);color:var(--txt);max-width:100%}
.bar input[type=search]{flex:1 1 220px}
.bar label{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--sub);cursor:pointer}
.bar .n{margin-left:auto;color:var(--sub);font-size:13px}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--borde);background:var(--card);color:var(--txt);cursor:pointer}
.btn:hover{border-color:var(--rojo);color:var(--rojo)}
.tabla{overflow-x:auto;background:var(--card);border:1px solid var(--borde);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;padding:10px;border-bottom:2px solid var(--borde);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--rojo)}
th.asc::after{content:" ▲";font-size:10px;color:var(--rojo)}th.desc::after{content:" ▼";font-size:10px;color:var(--rojo)}
td{padding:8px 10px;border-bottom:1px solid var(--borde);vertical-align:middle}
tr:hover td{background:var(--fila)}
td.num,th.num{text-align:right;white-space:nowrap}
td img{width:40px;height:40px;object-fit:cover;border-radius:8px;background:var(--fila);display:block}
td.prod{min-width:220px}td.prod a{text-decoration:none;font-weight:500}td.prod a:hover{color:var(--rojo);text-decoration:underline}
.tag{display:inline-block;background:var(--fila);border-radius:6px;padding:1px 6px;margin:1px;font-size:11.5px;white-space:nowrap}
.up{color:var(--sube);font-weight:600}.down{color:var(--baja);font-weight:600}.mut{color:var(--sub)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-weight:600;font-size:12px}
.pill.up{background:var(--sube-bg)}.pill.down{background:var(--baja-bg)}
.pag{display:flex;gap:6px;justify-content:center;margin-top:12px;align-items:center;color:var(--sub);font-size:13px}
.paises{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.paises small{color:var(--sub);margin:0 4px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.paises button{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--borde);background:var(--card);color:var(--txt);cursor:pointer}
.paises button.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.paises button.vacio{opacity:.5}
.vacio-msg{padding:30px;text-align:center;color:var(--sub)}
.nota{font-size:13px;color:var(--sub);margin-top:18px}
.nota summary{cursor:pointer;color:var(--txt);font-weight:500}
.heat td.num{font-weight:600}
.ancho{grid-column:1/-1}
svg.sp{display:block}
@media (max-width:600px){.barra{grid-template-columns:105px 1fr 46px;font-size:13px}h1{font-size:19px}.card{padding:14px}body{overflow-x:hidden}}
</style>
</head>
<body>
<header><div class="w">
  <h1>Livezy <span>· Radar de producto</span></h1>
  <div class="meta" id="meta">Cargando…</div>
  <nav id="nav">
    <button data-v="resumen" class="on">Resumen</button>
    <button data-v="tendencias">Tendencias por país</button>
    <button data-v="lanzamientos">Lanzamientos</button>
    <button data-v="productos">Todos los productos</button>
    <button data-v="cambios">Cambios de la semana</button>
  </nav>
</div></header>
<main class="w" id="app"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = {US:'$', UK:'£', EU:'€'};
const precio = (p, pa) => p == null ? '—' : (MON[pa] || '') + Number(p).toFixed(2);
const fecha = s => s ? new Date(s + 'T12:00').toLocaleDateString('es-ES', {day:'numeric', month:'short', year:'numeric'}) : '—';
const pctTxt = v => v == null ? '<span class="mut">—</span>' : `<span class="pill ${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${v} %</span>`;
const AR = {'كرياتين': 'creatina', 'مغنيسيوم': 'magnesio', 'كولاجين': 'colágeno', 'فيتامين د': 'vitamina D', 'اشواغندا': 'ashwagandha', 'جلوتاثيون': 'glutatión', 'بروتين': 'proteína'};
const palabra = p => AR[p] ? `${esc(p)} <span class="mut">(${AR[p]})</span>` : esc(p);
const num = n => n.toLocaleString('es-ES', {useGrouping: 'always'});
const GOLFO = ['SA','AE','KW','QA','BH','OM','EG'], OESTE = ['US','GB','ES','DE','FR'];
let D, vista = 'resumen', zona = 'SA';

function spark(v, w = 120, h = 28) {
  if (!v || !v.length) return '';
  const max = Math.max(...v, 1), st = w / (v.length - 1);
  const pts = v.map((y, i) => `${(i * st).toFixed(1)},${(h - 2 - (y / max) * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="var(--rojo)" stroke-width="1.5" points="${pts}"/></svg>`;
}

// ---------- tabla tipo Excel ----------
function tabla(el, {filas, cols, filtros = [], orden, porPagina = 100, csv}) {
  const st = {q: '', f: {}, orden: orden || null, pag: 0};
  el.innerHTML = `<div class="bar"><input type="search" placeholder="Buscar…">${filtros.map((f, i) => f.tipo === 'check'
      ? `<label><input type="checkbox" data-i="${i}"> ${f.nombre}</label>`
      : `<select data-i="${i}"><option value="">${f.nombre}: todos</option>${f.opciones.map(o => `<option>${esc(o)}</option>`).join('')}</select>`).join('')}
    ${csv ? '<button class="btn" data-csv>Descargar Excel (CSV)</button>' : ''}<span class="n"></span></div>
    <div class="tabla"><table><thead><tr>${cols.map((c, i) => `<th data-i="${i}" class="${c.num ? 'num' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody></tbody></table></div>
    <div class="pag"></div>`;
  const filtrar = () => {
    const q = st.q.toLowerCase();
    let r = filas.filter(x => (!q || cols.some(c => String(c.texto ? c.texto(x) : c.v(x) ?? '').toLowerCase().includes(q)))
      && filtros.every((f, i) => !st.f[i] || f.ok(x, st.f[i])));
    if (st.orden) {
      const [i, dir] = st.orden, c = cols[i];
      r = r.slice().sort((a, b) => {
        const va = c.v(a), vb = c.v(b);
        if (va == null || va === '') return 1; if (vb == null || vb === '') return -1;
        return (typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'es')) * dir;
      });
    }
    return r;
  };
  const pintar = () => {
    const r = filtrar(), np = Math.max(1, Math.ceil(r.length / porPagina));
    st.pag = Math.min(st.pag, np - 1);
    $('tbody', el).innerHTML = r.slice(st.pag * porPagina, (st.pag + 1) * porPagina)
      .map(x => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.h ? c.h(x) : esc(c.v(x) ?? '—')}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${cols.length}" class="vacio-msg">No hay nada con estos filtros.</td></tr>`;
    $('.n', el).textContent = `${num(r.length)} filas`;
    el.querySelectorAll('th').forEach((th, i) => th.className = (cols[i].num ? 'num ' : '') + (st.orden && st.orden[0] === i ? (st.orden[1] > 0 ? 'asc' : 'desc') : ''));
    $('.pag', el).innerHTML = np > 1 ? `<button class="btn" ${st.pag ? '' : 'disabled'} data-p="-1">← Anterior</button> Página ${st.pag + 1} de ${np} <button class="btn" ${st.pag < np - 1 ? '' : 'disabled'} data-p="1">Siguiente →</button>` : '';
  };
  $('input[type=search]', el).oninput = e => { st.q = e.target.value; st.pag = 0; pintar(); };
  el.querySelectorAll('.bar select, .bar input[type=checkbox]').forEach(s => s.onchange = e => {
    st.f[s.dataset.i] = s.type === 'checkbox' ? s.checked : s.value; st.pag = 0; pintar(); });
  el.querySelectorAll('th').forEach(th => th.onclick = () => {
    const i = +th.dataset.i, c = cols[i];
    st.orden = st.orden && st.orden[0] === i ? [i, -st.orden[1]] : [i, c.num ? -1 : 1]; pintar(); });
  $('.pag', el).onclick = e => { if (e.target.dataset.p) { st.pag += +e.target.dataset.p; pintar(); el.scrollIntoView({behavior: 'smooth'}); } };
  if (csv) $('[data-csv]', el).onclick = () => {
    const r = filtrar(), sep = ';', cel = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const txt = [cols.filter(c => !c.sinCsv).map(c => cel(c.t)).join(sep)]
      .concat(r.map(x => cols.filter(c => !c.sinCsv).map(c => cel(c.v(x))).join(sep))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + txt], {type: 'text/csv'})); a.download = `radar-livezy-${csv}-${D.fecha}.csv`; a.click();
  };
  el.preset = (i, v) => { const s = el.querySelector(`.bar select[data-i="${i}"]`); s.value = v; st.f[i] = v; st.pag = 0; pintar(); };
  pintar();
  return el;
}

const opciones = (arr) => [...new Set(arr.flat().filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
function colsProducto() {
  return [
    {t: '', v: () => null, h: x => x.i ? `<img loading="lazy" src="${esc(x.i)}" alt="">` : '', sinCsv: true},
    {t: 'Producto', v: x => x.n, cls: 'prod', h: x => `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a>${x.nuevo ? ' <span class="tag" style="color:var(--rojo)">nuevo</span>' : ''}`},
    {t: 'Tienda', v: x => x.t},
    {t: 'País', v: x => x.pa},
    {t: 'Ingredientes', v: x => x.ing.join(', '), h: x => x.ing.map(i => `<span class="tag">${esc(i)}</span>`).join('') || '<span class="mut">—</span>'},
    {t: 'Formato', v: x => x.fmt.join(', '), h: x => x.fmt.map(i => `<span class="tag">${esc(i)}</span>`).join('') || '<span class="mut">—</span>'},
    {t: 'Precio', num: 1, v: x => x.p, h: x => precio(x.p, x.pa)},
    {t: 'Descuento', num: 1, v: x => x.d, h: x => x.d ? `<span class="down">-${x.d} %</span>` : '<span class="mut">—</span>'},
    {t: 'Puesto en ventas', num: 1, v: x => x.r, h: x => x.r ? `${x.r}${x.ra && x.ra !== x.r ? ` <span class="${x.ra > x.r ? 'up' : 'down'}">${x.ra > x.r ? '↑' : '↓'}${Math.abs(x.ra - x.r)}</span>` : ''}` : '<span class="mut">—</span>'},
    {t: 'Stock', v: x => x.s ? 'Sí' : 'Agotado', h: x => x.s ? 'Sí' : '<span class="down">Agotado</span>'},
    {t: 'Alta', num: 1, v: x => x.c, h: x => fecha(x.c)},
  ];
}
function filtrosProducto(extra = []) {
  return [
    {nombre: 'Ingrediente', opciones: opciones(D.productos.map(x => x.ing)), ok: (x, v) => x.ing.includes(v)},
    {nombre: 'Formato', opciones: opciones(D.productos.map(x => x.fmt)), ok: (x, v) => x.fmt.includes(v)},
    {nombre: 'Tienda', opciones: opciones(D.productos.map(x => x.t)), ok: (x, v) => x.t === v},
    {nombre: 'País de la tienda', opciones: opciones(D.productos.map(x => x.pa)), ok: (x, v) => x.pa === v},
    ...extra,
  ];
}
const hace = n => new Date(Date.parse(D.fecha) - n * 864e5).toISOString().slice(0, 10);

// ---------- vistas ----------
const V = {};
V.resumen = app => {
  const n90 = D.productos.filter(x => x.c && x.c >= hace(90));
  const cuenta = (lista, campo) => {
    const m = {}; lista.forEach(x => x[campo].forEach(k => { (m[k] ||= {n: 0, t: new Set()}).n++; m[k].t.add(x.t); }));
    return Object.entries(m).sort((a, b) => b[1].n - a[1].n);
  };
  const ing = cuenta(n90, 'ing').slice(0, 10), fmt = cuenta(n90, 'fmt');
  const barras = (l, tipo) => { const max = l[0]?.[1].n || 1; return l.map(([k, o]) =>
    `<div class="barra" data-${tipo}="${esc(k)}" title="Ver estos lanzamientos"><span>${esc(k)}</span><div class="b"><i style="width:${o.n / max * 100}%"></i></div><small>${o.n}${tipo === 'ing' ? ` · ${o.t.size}t` : ''}</small></div>`).join(''); };
  const z = D.tendencias.SA ? 'SA' : Object.keys(D.tendencias).find(k => Object.keys(D.tendencias[k]).length);
  const suben = Object.entries(D.tendencias[z] || {}).filter(([, t]) => t.da != null).sort((a, b) => b[1].da - a[1].da).slice(0, 8);
  const bo = (D.relacionadas.SA || []).concat(D.relacionadas.AE || []).filter(r => r.v === 'Breakout');
  const boU = [...new Map(bo.map(r => [r.q, r])).values()].filter(r => !/near me/i.test(r.q)).slice(0, 48);
  const nSuben = Object.values(D.tendencias.SA || {}).filter(t => t.da > 15).length;
  app.innerHTML = `
  <div class="grid kpis">
    <div class="card kpi"><b>${D.tiendas.filter(t => t.n).length}</b><span>tiendas de la competencia seguidas a diario</span></div>
    <div class="card kpi"><b>${num(D.productos.length)}</b><span>productos con precio, stock y ventas</span></div>
    <div class="card kpi"><b>${n90.length}</b><span>lanzamientos en los últimos 90 días</span></div>
    <div class="card kpi"><b>${nSuben}</b><span>búsquedas que suben más de un 15 % en Arabia Saudí frente al año pasado</span></div>
  </div>
  <div class="grid dos" style="margin-top:16px">
    <div class="card"><h3>Qué está lanzando la competencia</h3><p class="s">Ingredientes de los productos nuevos de los últimos 90 días («t» = tiendas distintas). Pulsa uno para ver los productos.</p>${barras(ing, 'ing')}</div>
    <div class="card"><h3>En qué formato</h3><p class="s">Formato de esos mismos lanzamientos.</p>${barras(fmt, 'fmt')}</div>
    <div class="card"><h3>Lo que más sube en ${esc(D.zonas[z])}</h3><p class="s">Interés en Google en las últimas 12 semanas frente a las mismas semanas del año pasado.</p>
      <table>${suben.map(([p, t]) => `<tr><td>${palabra(p)}</td><td>${spark(t.v.slice(-52), 110, 24)}</td><td class="num">${pctTxt(t.da)}</td></tr>`).join('')}</table>
      <p class="s" style="margin-top:10px"><a href="#" data-ir="tendencias">Ver todos los países →</a></p></div>
    <div class="card ancho"><h3>Búsquedas disparadas en Arabia y Emiratos</h3><p class="s">Búsquedas que han crecido más de un 5000 % en los últimos meses. Aquí suelen salir los productos nuevos antes que en las tiendas.</p>
      <div class="chips">${boU.map(r => `<span class="chip bo" title="relacionada con ${esc(r.p)}">${esc(r.q)}</span>`).join('') || '<span class="mut">Sin datos todavía.</span>'}</div></div>
  </div>
  <details class="nota"><summary>Cómo leer el radar</summary>
    <p>Cada día a las 08:00 de Arabia se leen ${D.tiendas.length} tiendas de suplementos: catálogo, precios, stock y su orden de «más vendidos» (puesto 1 = el que más vende de esa tienda). Los lanzamientos usan la fecha de alta del producto en la tienda.</p>
    <p>Google Trends da el interés relativo (0-100) de cada búsqueda por separado: sirve para ver si sube o baja, no para comparar volúmenes entre búsquedas distintas. Cada país se actualiza cada 6 días.</p>
    <p>Histórico de tiendas: ${D.dias} día${D.dias > 1 ? 's' : ''} (desde ${fecha(D.desde)}). Los cambios de la semana y las subidas en ventas aparecen cuando hay al menos 7 días para comparar.</p></details>`;
  app.querySelectorAll('[data-ing],[data-fmt]').forEach(b => b.onclick = () => ir('lanzamientos', b.dataset.ing ? [0, b.dataset.ing] : [1, b.dataset.fmt]));
  $('[data-ir]', app).onclick = e => { e.preventDefault(); ir('tendencias'); };
};

V.lanzamientos = (app, preset) => {
  app.innerHTML = '<div class="card" style="margin-bottom:14px"><h3>Lanzamientos de la competencia</h3><p class="s" style="margin:0">Productos dados de alta en el periodo elegido. Pulsa en una columna para ordenar; vuelve a pulsar para invertir el orden.</p></div><div id="t"></div>';
  const periodos = {'Últimos 30 días': 30, 'Últimos 90 días': 90, 'Últimos 6 meses': 180, 'Último año': 365};
  const t = tabla($('#t', app), {
    filas: D.productos.filter(x => x.c && x.c >= hace(365)), cols: colsProducto(), csv: 'lanzamientos', orden: [10, -1],
    filtros: filtrosProducto([{nombre: 'Periodo', opciones: Object.keys(periodos), ok: (x, v) => x.c >= hace(periodos[v])}]),
  });
  t.preset(4, 'Últimos 90 días');
  if (preset) t.preset(...preset);
};

V.productos = app => {
  app.innerHTML = '<div class="card" style="margin-bottom:14px"><h3>Todos los productos</h3><p class="s" style="margin:0">El catálogo entero de las tiendas que seguimos. Ordena por «Puesto en ventas» para ver los más vendidos de cada tienda, o filtra por ingrediente para comparar precios.</p></div><div id="t"></div>';
  tabla($('#t', app), {
    filas: D.productos, cols: colsProducto(), csv: 'productos', orden: [8, 1],
    filtros: filtrosProducto([
      {nombre: 'Solo con puesto en ventas', tipo: 'check', ok: x => x.r},
      {nombre: 'Solo en oferta', tipo: 'check', ok: x => x.d},
      {nombre: 'Solo agotados', tipo: 'check', ok: x => !x.s},
    ]),
  });
};

V.cambios = app => {
  if (!D.comparado) {
    const d = new Date(Date.parse(D.desde) + 7 * 864e5).toISOString().slice(0, 10);
    app.innerHTML = `<div class="card vacio-msg"><h3>Todavía no hay una semana de datos</h3><p>El radar empezó el ${fecha(D.desde)}. A partir del ${fecha(d)} aquí saldrán los productos nuevos, los retirados, los cambios de precio y los que suben en ventas.</p></div>`;
    return;
  }
  app.innerHTML = `<div class="card" style="margin-bottom:14px"><h3>Cambios desde el ${fecha(D.comparado)}</h3><p class="s" style="margin:0">Lo que ha cambiado en las tiendas en la última semana.</p></div><div id="t"></div>`;
  const pa = Object.fromEntries(D.tiendas.map(t => [t.t, t.pa]));
  tabla($('#t', app), {
    filas: D.cambios, csv: 'cambios', orden: [0, 1],
    cols: [
      {t: 'Qué', v: x => x.tipo, h: x => `<span class="${/Sube en|Nuevo|Baja de/.test(x.tipo) ? 'up' : 'down'}">${esc(x.tipo)}</span>`},
      {t: 'Producto', v: x => x.n, cls: 'prod', h: x => `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a>`},
      {t: 'Tienda', v: x => x.t},
      {t: 'Antes', num: 1, v: x => x.antes, h: x => x.tipo === 'Sube en ventas' ? `puesto ${x.antes}` : precio(x.antes, pa[x.t])},
      {t: 'Ahora', num: 1, v: x => x.ahora, h: x => x.tipo === 'Sube en ventas' ? `puesto ${x.ahora}` : precio(x.ahora, pa[x.t])},
    ],
    filtros: [{nombre: 'Tipo', opciones: opciones(D.cambios.map(x => x.tipo)), ok: (x, v) => x.tipo === v},
              {nombre: 'Tienda', opciones: opciones(D.cambios.map(x => x.t)), ok: (x, v) => x.t === v}],
  });
};

V.tendencias = app => {
  const hay = z => Object.keys(D.tendencias[z] || {}).length;
  const btn = z => `<button data-z="${z}" class="${zona === z ? 'on' : ''} ${hay(z) ? '' : 'vacio'}">${esc(D.zonas[z])}</button>`;
  app.innerHTML = `<div class="paises"><small>Golfo y Oriente Medio</small>${GOLFO.map(btn).join('')}<small>Occidente</small>${OESTE.map(btn).join('')}<small>Global</small>${btn('')}
    <button data-z="*" class="${zona === '*' ? 'on' : ''}">Comparar países</button></div><div id="tz"></div>`;
  app.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { zona = b.dataset.z; V.tendencias(app); });
  const cont = $('#tz', app);
  if (zona === '*') {
    const zs = [...GOLFO, ...OESTE, ''].filter(hay), palabras = opciones(zs.map(z => Object.keys(D.tendencias[z])));
    cont.innerHTML = `<div class="card" style="margin-bottom:14px"><h3>Comparar países</h3><p class="s" style="margin:0">Cambio del interés en Google en las últimas 12 semanas frente a las mismas semanas del año pasado. Pulsa un país para ordenar por él.</p></div><div id="t" class="heat"></div>`;
    tabla($('#t', cont), {
      filas: palabras.map(p => ({p, ...Object.fromEntries(zs.map(z => [z || 'W', D.tendencias[z][p]?.da]))})), porPagina: 200,
      cols: [{t: 'Búsqueda', v: x => x.p, h: x => palabra(x.p)}, ...zs.map(z => ({t: esc(D.zonas[z]), num: 1, v: x => x[z || 'W'], h: x => pctTxt(x[z || 'W'])}))],
      orden: [1, -1], csv: 'paises',
    });
    return;
  }
  if (!hay(zona)) {
    cont.innerHTML = `<div class="card vacio-msg"><h3>${esc(D.zonas[zona])}: todavía sin datos</h3><p>Se está recogiendo. Cada país se actualiza cada 6 días; vuelve en un rato o mañana.</p></div>`;
    return;
  }
  const filas = Object.entries(D.tendencias[zona]).map(([p, t]) => ({p, ...t}));
  const rel = D.relacionadas[zona] || [];
  const porP = {}; rel.forEach(r => (porP[r.p] ||= []).push(r));
  cont.innerHTML = `<div class="card" style="margin-bottom:14px"><h3>${esc(D.zonas[zona])}</h3><p class="s" style="margin:0">Interés en Google (0-100) de cada búsqueda. La línea son los últimos 2 años. Actualizado el ${fecha(D.zonas_act[zona])}.</p></div>
    <div id="t"></div>
    ${rel.length ? `<div class="card" style="margin-top:16px"><h3>Búsquedas relacionadas en auge en ${esc(D.zonas[zona])}</h3><p class="s">Lo que la gente busca junto a cada término y está creciendo. «Breakout» = más de un 5000 %.</p>
      ${Object.entries(porP).map(([p, l]) => `<p style="margin:10px 0 4px"><b>${palabra(p)}</b></p><div class="chips">${l.map(r => `<span class="chip ${r.v === 'Breakout' ? 'bo' : ''}">${esc(r.q)} · ${esc(r.v)}</span>`).join('')}</div>`).join('')}</div>` : ''}`;
  tabla($('#t', cont), {
    filas, porPagina: 100, csv: 'tendencias-' + (zona || 'mundial'), orden: [4, -1],
    cols: [
      {t: 'Búsqueda', v: x => x.p, h: x => palabra(x.p)},
      {t: 'Últimos 2 años', v: () => null, h: x => spark(x.v), sinCsv: true},
      {t: 'Interés (0-100)', num: 1, v: x => x.m},
      {t: 'vs 12 semanas antes', num: 1, v: x => x.d12, h: x => pctTxt(x.d12)},
      {t: 'vs hace un año', num: 1, v: x => x.da, h: x => pctTxt(x.da)},
    ],
  });
};

function ir(v, preset) {
  vista = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  V[v]($('#app'), preset);
  try { localStorage.setItem('radar-vista', v); } catch (e) {}
  history.replaceState(null, '', '#' + v);
  scrollTo({top: 0});
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => ir(b.dataset.v));

fetch('datos.json?' + Date.now()).then(r => r.json()).then(d => {
  D = d;
  $('#meta').textContent = `Actualizado el ${fecha(D.fecha)} · ${D.tiendas.filter(t => t.n).length} tiendas · ${num(D.productos.length)} productos · ${Object.values(D.tendencias).filter(t => Object.keys(t).length).length} países en Google Trends`;
  let v = location.hash.slice(1); if (!V[v]) try { v = localStorage.getItem('radar-vista'); } catch (e) {}
  ir(V[v] ? v : 'resumen');
}).catch(() => { $('#app').innerHTML = '<div class="card vacio-msg">No se han podido cargar los datos.</div>'; });
</script>
</body>
</html>
