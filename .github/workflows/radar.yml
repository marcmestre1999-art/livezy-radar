name: radar
on:
  schedule:
    - cron: '0 5 * * *'   # cada día a las 08:00 de Arabia Saudí
  workflow_dispatch:
permissions:
  contents: write
concurrency: radar
jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python radar.py todo
      - name: Guardar datos
        run: |
          git config user.name "radar"
          git config user.email "radar@users.noreply.github.com"
          git add radar.db docs
          git diff --cached --quiet || git commit -m "datos $(date -u +%F)"
          git push
